        <script>
            $(document).ready(function () {
                $('#errorreason').hide();
                $(".btncheckin").click(function (e) {
                   // debugger;
                    e.preventDefault();
                    var patientID = $(this).parent().find('.todayApptPatientID').val();
                    var userID = $(this).parent().find('.todayApptUserID').val();

                    $.ajax({
                        url: '../home/patientcheckin?patientID=' + patientID + '&userID=' + userID,
                        type: 'GET',
                        success: function (data, textStatus, jqXHR) {
                            if (data == "False") {
                                DisplayMessage(Warning + SpanStart + "Patient already checked in." + SpanEnd);
                            }
                            else {
                                DisplayMessage(SuccessCheck + SpanStart + "Patient check in successful." + SpanEnd);
                            }
                        }
                    });
                });

                $(".btnConsultation").click(function (e) {
                    
                    e.preventDefault();
                    var patientID = $(this).parent().find('.todayApptPatientID').val();
                    var userID = $(this).parent().find('.todayApptUserID').val();
                    var consultationCode = $(this).parent().find('.todayApptConsultationCode').val();
                    //console.log(consultationCode);
                    window.location = "/" + consultationCode + "/consultation?patientid=" + patientID;

                });
                var EventID, Title, UserID, Mobile, EventDate, EventTime;

                $(".btnAppointment").click(function () {
                    EventID = $(this).parent().find('.todayApptID').val();
                    Title = $(this).parent().find('.todayApptTitle').val();
                    UserID = $(this).parent().find(".todayApptUserID").val();
                    Mobile = $(this).parent().find(".todayApptMobile").val();
                    EventDate = $(this).parent().find('.todayApptEventDate').val(),
                    EventTime = $(this).parent().find('.todayApptEventTime').val(),
                    $("#divreason").css("display", "none");
                    $('#reason').val('Patient No-show');


                });
                $(".apptPay").click(function () {
                    $("#patientNameGlobal").val("");
                    $("#patientPurposeGlobal").val("");
                    $("#patientMobileGlobal").val("");
                    $("#patientEmailGlobal").val("");
                    $("#patientIDGlobal").val("");
                    $("#servicetaxGlobal").text("");
                    $("#finalAmountGlobal").text("");
                    $("#patientAmountGlobal").val("");

                    var userName = $(this).parent().find('.todayApptTitle').val();
                    $("#patientNameGlobal").val(userName);
                    GetPatientPendingBill(userName);
                });

                $('#selectreason').change(function () {

                    if ($('option:selected', this).text() != 'Other') {
                        $('#reason').val($('option:selected', this).text());
                        $('#divreason').hide();
                    }
                    else {
                        $('#reason').val('');
                        $('#divreason').show();
                        $('#reason').focus();
                    }

                });
                function ValidateAppointmentCancel() {

                    var valid = true;


                    $('#errorreason').hide();
                    var x = $('#reason').val()
                    if (x == null || x == "" || x == 'Select') {
                        $('#errorreason').show();
                        $('#reason').focus();
                        valid = false;
                    }

                    return valid;

                }

                $(document).on("click", "#deleteAppointment", function (event) {


                    //$('#popupEventForm').modal('hide');
                    event.preventDefault();
                    if (ValidateAppointmentCancel()) {
                        $('.bs-example-modal-sm').modal('hide');
                        var dataRow = {
                            'EventID': EventID,
                            'Title': Title,
                            'UserID': UserID,
                            'Mobile': Mobile,
                            'AppointmentCancelReason': $("#reason").val(),
                            'EventDate': EventDate,
                            'EventTime': EventTime,
                        }



                        // ClearPopupFormValues();

                        $.ajax({
                            type: 'POST',
                            url: "/Calendar/DeleteEvent",
                            data: dataRow,
                            success: function (response) {
                                
                                if (response == 'True') {

                                    location.reload();

                                    TodaysAppointment1();
                                   
                                }
                                else {

                                    DisplayMessage(ErrorCross + SpanStart +"Something went wrong! Please try again." + SpanEnd);
                                }
                            }
                        });
                    }

                });

                function TodaysAppointment1() {
                    var url = "/home/AppointmentList";
                    var pane = $(this);

                    // ajax load from data-url
                    //$("#contentPadding").load(url, function (result) {
                    //    pane.tab('show');
                    //});

                          $.ajax({
                        type: 'GET',
                        url: "/home/AppointmentList",

                              success: function (response) {
                                  
                                  //console.log(response);
                                  $("#contentPadding").html();
                                  $("#contentPadding").html(response);
                        }
                    });
                }

           function () {
               $(this).attr('src', '../../Content/images/Cancel-normal-icon.png')
           },
           function () {
               $(this).attr('src', '../../Content/images/Cancel-hover-icon.png')
           }
        )

                $('.btncheckin').hover(
           function () {
               $(this).attr('src', '../../Content/images/Checkin-normal-icon.png')
           },
           function () {
               $(this).attr('src', '../../Content/images/Checkin-hover-icon.png')
           }
        )

                $('.btnConsultation').hover(
           function () {
               $(this).attr('src', '../../Content/images/Consultation-normal-icon.png')
           },
           function () {
               $(this).attr('src', '../../Content/images/Consultation-hover-icon.png')
           }
        )

                $('.btnSMS').hover(
  function () {
      $(this).attr('src', '../../Content/images/sms-hover-icon.png')
      $(this).css('cursor', 'pointer')
  },
  function () {
      $(this).attr('src', '../../Content/images/sms-normal-icon.png')
      $(this).css('cursor', 'pointer')
  }
)
            });


            $(".btnSMS").click(function () {
                //  heading_today smsID

                //.attr('href'));

                var patientID = $(this).parent().find('.todayApptPatientID').val();
                //var typ = getURLParameter(url, 'typ');

                //console.log(patientID);

                SendMessage(patientID);

            function SendMessage(patientID) {


                url = "../Patient/SendMessage?patientID=" + patientID;
                $.ajax(
                {
                    url: url,
                    type: "GET",
                    async: false,
                    success: function (data, textStatus, jqXHR) {

                        $("#sendmessage").html(data);



                    //    $("div.Editor-editor").text("Default Text ");

                    },
                    error: function (jqXHR, textStatus, errorThrown) {

                        DisplayMessage(ErrorCross + SpanStart + "Something went wrong! Please try again." + SpanEnd);
                    }
                });
                //}
            }

        </script>
