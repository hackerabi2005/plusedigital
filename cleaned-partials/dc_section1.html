    $('.action').on("click", function () {

        });
        $('#loadingConsultation').show();
        actionClicked = $(this).attr('id');

        switch (actionClicked) {
            case "caries":
                dentalCondition = "1";
                break;
            case "fracture":
                dentalCondition = "2";
                break;
            case "mobility":
                dentalCondition = "3";
                break;
            case "rootStump":
                dentalCondition = "4";
                break;
            case "missingTooth":
                dentalCondition = "5";
                break;
            case "abrasion":
                dentalCondition = "6";
                break;
            case "attrition":
                dentalCondition = "7";
                break;
            case "impacted":
                dentalCondition = "8";

            case "supraErupted":
                dentalCondition = "9";

    function GetTeethImage(teethNumber, dentalCondition) {
        var mobile = $('#mobileView').val();
        var url = '';

        if (mobile != "1") {
            url = "../dental/GetTeethImage?consultationID=" + $("#consultationID").val() + "&patientID=" + $("#patientID").val() + "&teethNumber=" + teethNumber;
        }
        else {
            url = "../dental/GetTeethImage?consultationID=" + $("#consultationID").val() + "&patientID=" + $("#patientID").val() + "&teethNumber=" + teethNumber + "&mobile=1";
        }

        $.get(url, function (data) {
            $('#' + teethNumber).html(data);
            $('.B' + teethNumber).html(data);

            if (dentalCondition == "0") {

                if ($("#selectChart").val() == 'both') {
                    if (teethNumber[0] == "1" || teethNumber[0] == "2") {
                        $("<span class='infoIconUpper opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();
                    }
                    else if (teethNumber[0] == "3" || teethNumber[0] == "4") {
                        $("<span class='infoIconLower opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();
                    }
                    else if (teethNumber[0] == "5" || teethNumber[0] == "6") {
                        $("<span class='infoIconUpper opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();
                    }
                    else {
                        $("<span class='infoIconLower opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();
                    }
                }
                else {
                    if (teethNumber[0] == "1" || teethNumber[0] == "2") {
                        $("<span class='infoIconUpper opacityNone' id='N" + teethNumber + "'></span>").prependTo("#" + teethNumber).children();
                    }
                    else if (teethNumber[0] == "3" || teethNumber[0] == "4") {
                        $("<span class='infoIconLower opacityNone' id='N" + teethNumber + "'></span>").prependTo("#" + teethNumber).children();
                    }
                    else if (teethNumber[0] == "5" || teethNumber[0] == "6") {
                        $("<span class='infoIconUpper opacityNone' id='N" + teethNumber + "'></span>").prependTo("#" + teethNumber).children();
                    }
                    else {
                        $("<span class='infoIconLower opacityNone' id='N" + teethNumber + "'></span>").prependTo("#" + teethNumber).children();
                    }
                }

                if ($.inArray(parseInt(teethNumber), Teeths1) !== -1) {
                    var teethindex = parseInt(teethNumber.trim('"'));
                    var index = Teeths1.indexOf(teethindex);
                    Teeths1.splice(index, 1);
                    Notes1.splice(index, 1);
                    $('#N' + teethindex).parent().removeAttr("title");
                    $('#NN' + teethindex).parent().removeAttr("title");
                }

                TeethNotes1(Teeths1, Notes1);
            }
            else {
                if ($("#selectChart").val() == 'both') {
                    if (teethNumber[0] == "1" || teethNumber[0] == "2") {
                        $("<span class='infoIconUpper opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();
                    }
                    else if (teethNumber[0] == "3" || teethNumber[0] == "4") {
                        $("<span class='infoIconLower opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();
                    }
                    else if (teethNumber[0] == "5" || teethNumber[0] == "6") {
                        $("<span class='infoIconUpper opacityNone' id='NN" + teethNumber + "'></span>").prependTo(".B" + teethNumber).children();

                    }
                    else if (teethNumber[0] == "3" || teethNumber[0] == "4") {
                        $("<span class='infoIconLower opacityNone' id='N" + teethNumber + "'></span>").prependTo("#" + teethNumber).children();

                    else {
                        $("<span class='infoIconLower opacityNone' id='N" + teethNumber + "'></span>").prependTo("#" + teethNumber).children();
                    }
                }
                TeethNotes();
            }
        });
    }
