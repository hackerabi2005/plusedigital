    function GetPaymentEdit(billID,pendingAmount)
    {
      //  debugger;
        document.body.scrollTop = 0;
        document.documentElement.scrollTop = 0;

        url = "../Patient/GetPaymentBill?billID=" + billID + "&pendingAmount=" + pendingAmount + "&patientID=" + 2223997;
        $.ajax({
            url: url,
            type: "GET",
            async: true,
            success: function (data, textStatus, jqXHR) {
                $('#AccordianContainer').removeClass('fixedColumnSize-24');
                $('#LoadForms').html('');
                $('#LoadForms').html(data);
            }, error: function (jqXHR, textStatus, errorThrown) {

                //if fails
            }
            });

    }
