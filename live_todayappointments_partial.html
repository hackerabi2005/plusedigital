        function getURLParameter(url, name) {
            return (RegExp(name + '=' + '(.+?)(&|$)').exec(url) || [, null])[1];
        }

        function SendMessage(patientID) {

            //debugger;
            url = "../Patient/SendMessage?patientID=" + patientID;
            $.ajax(
                {
                    url: url,
                    type: "GET",
                    async: false,
                    success: function (data, textStatus, jqXHR) {

                        $("#sendmessage").html(data);

                        //   $("div.Editor-editor").text("Default Text ");

        });


        $('#selectreason').change(function () {
          
            if ($('option:selected', this).text() != 'Other') {
                $('#reason').val($('option:selected', this).text());
                $('#divreason').hide();
            }
            else {
                $('#reason').val('');
                $('#divreason').show();
                $('#reason').focus();
            }

        });
        function ValidateAppointmentCancel() {

            var valid = true;

            $('#errorreason').hide();
            var x = $('#reason').val()
            if (x == null || x == "" || x == 'Select') {
                $('#errorreason').show();
                $('#reason').focus();
                valid = false;
            }

            return valid;

        }

        /**
         * Added to refresh the dashboard appointment booked
         */
        function TodaysWidgetAppointmet() {
           
            var today = new Date();
            var dd = today.getDate();
            var mm = today.getMonth() + 1; //January is 0!

            var yyyy = today.getFullYear();
            if (dd < 10) {
                dd = '0' + dd;
            }
            if (mm < 10) {
                mm = '0' + mm;
            }
            today = dd + '/' + mm + '/' + yyyy;
            var date = today;
            
            var url = '../home/GetAppointmentTimings?date=' + date;
            var pane = $(this);
            GetAppointmentTimings(date);

            // ajax load from data-url
            //$("#AppointmentTimingsdiv").load(url, function (result) {
            //    pane.tab('show');

        }

                if ($(this).attr('src') == '../../Content/images/svg/minus.svg' && $('#' + collaspsedivID).hasClass('show')) {

                    //need to add collapsing class for effect

                    //need to add collapsing class for effect

                    $('#' + collaspsedivID).addClass('show');
                    e.preventDefault();

                }
            }
