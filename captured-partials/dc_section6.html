    <script type="text/javascript">
        $(document).ready(function () {
            
            if (screen.availWidth <= 767) {
                $('.consultationhistorydesktop').remove();
               $("#history").find('tbody tr').first().addClass('selectedTableRow');
                $("#history").find('tr').click(function () {
                    $("#history").find('tr').removeClass('selectedTableRow');
                    $(this).addClass('selectedTableRow');
                    var row = $(this).find('td:first').text().trim();
                    var date = $(this).find('td:nth-child(2)').text().trim();


                    $('#historyDetail').html($('#h-' + row).html());
                    $('#historyDate').text(date);
                });
            }
            else {
                $('.consultationhistorymobile').remove();
                $("#history").find('tbody tr').first().addClass('selectedTableRow');
                 $("#history").find('tr').click(function () {
            $("#history").find('tr').removeClass('selectedTableRow');

            var row = $(this).find('td:first').text().trim();
            var date = $(this).find('td:nth-child(2)').text().trim();


            $('#historyDetail').html($('#h-' + row).html());
            $('#historyDate').text(date);



        });
            }


        });




        

    </script>
